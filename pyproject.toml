[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgecnn"
version = "0.1.0"
description = "EN3150 Assignment 03 - Resource-Constrained CNN for Edge Image Classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Academic use - EN3150 coursework" }

# ---------------------------------------------------------------------------
# Runtime dependencies.
#
# IMPORTANT for the team: this list is the ONLY reason anyone ever needs to
# re-run `pip install -e .` after a git pull. Editing a .py file does not
# require a reinstall. See CONTRIBUTING.md.
# ---------------------------------------------------------------------------
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "pandas>=2.0",            # split manifest read/write
    "pyyaml>=6.0",            # config loading
    "jsonschema>=4.20",       # enforces the seam contracts in configs/contracts/
    "scikit-learn>=1.3",      # precision / recall / confusion matrix (Section 4)
    "matplotlib>=3.7",        # loss curves + confusion matrix figures
    "thop>=0.1.1",            # MAC counting for the Section 2 / 6 cost comparison
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.9",
    "jupyter>=1.0",
]

# ---------------------------------------------------------------------------
# src-layout: the package lives at src/edgecnn/ and is imported as `edgecnn`.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the repo root on sys.path so tests can import the shared `pending`
# helper via `from tests.conftest import pending`.
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "contract: validates a cross-member seam; a failure here means an interface broke",
    "slow: needs the real dataset or a full training run",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
