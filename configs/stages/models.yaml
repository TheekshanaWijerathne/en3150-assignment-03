# ===========================================================================
# STAGE 2 - CUSTOM ARCHITECTURES                  Assignment Section 2 [20]
#
# Owner:     Member 2
# Notebook:  notebooks/02_custom_architectures.ipynb
# Code:      src/edgecnn/models/custom/
#
# The numbers below are a STARTING POINT, not a prescription. Member 2 owns
# the architecture and is expected to change them - the report has to justify
# every kernel size, filter count and FC width. What must NOT change is the
# contract block at the bottom.
#
# Each section below is passed to its builder as keyword overrides by
# edgecnn.models.build_model_from_config, so the builder and this file agree.
# ===========================================================================

# --- SETTINGS --------------------------------------------------------------

# Model A: standard CNN. Interleaved Conv2d + MaxPool, per the assignment.
# Deliberately NOT parameter-constrained: it is the baseline that shows what
# Model B gives up.
model_a:
  blocks:
    - {out_channels: 32,  kernel_size: 3, stride: 1, padding: 1, pool: 2}
    - {out_channels: 64,  kernel_size: 3, stride: 1, padding: 1, pool: 2}
    - {out_channels: 128, kernel_size: 3, stride: 1, padding: 1, pool: 2}
  head:
    global_pool: false         # flatten an 8x8x128 map into the classifier
    fc_units: [128]
    dropout: 0.3
  activation: relu
  batch_norm: true

# Model B: lightweight depthwise-separable CNN.
# HARD CAP: 100,000 trainable parameters. tests/test_param_budget.py fails the
# build if it is exceeded - do not rely on reading a printout.
model_b:
  stem: {out_channels: 16, kernel_size: 3, stride: 1, padding: 1}
  # Width is added in the later blocks, which work on small 16x16 and 8x8 maps:
  # a channel there costs the same parameters as early on, but far fewer MACs.
  # 71,818 trainable parameters (72% of the cap), 13.0 M MACs per 64x64 image.
  blocks:
    - {out_channels: 32, stride: 1, pool: 2}
    - {out_channels: 64, stride: 1, pool: 2}
    - {out_channels: 160, stride: 1, pool: 2}
    - {out_channels: 320, stride: 1}           # 8x8 maps; no pooling before the global average
  head:
    global_pool: true          # GAP instead of flatten - this is where most of
                               # the parameter saving comes from, not the convs
    fc_units: []
    dropout: 0.2
  activation: relu6
  batch_norm: true

# --- SEAM 2 declaration ----------------------------------------------------

stages:
  models:
    owner: member_2
    produces_for: [member_3, member_1]
    settings: [model_a, model_b]

    inputs:
      from_data: num_classes and input_shape, from the DataBundle (SEAM 1)

    outputs:
      registry_keys: [model_a, model_b]
      architecture_table: results/tables/custom_architectures.md
      # Per-layer parameter derivation for the report. Section 2 asks for the
      # calculation, not just a torchsummary dump.
      param_breakdown: results/tables/param_breakdown.md

    contract:
      python_api: >-
        edgecnn.models.build_model_from_config(cfg, num_classes) -> torch.nn.Module,
        or build_model(name, num_classes, input_shape, seed=..., **overrides)
      forward:
        input:  {dtype: float32, shape: [B, 3, 64, 64]}
        output: {dtype: float32, shape: [B, num_classes], semantics: raw_logits}
      guarantees:
        - "returns RAW LOGITS - no softmax inside the model (CrossEntropyLoss applies it)"
        - "exposes .num_classes"
        - "model_b has <= 100000 trainable parameters"
        - "no layer assumes a batch size; batch size 1 must work for latency measurement"
        - "the same seed gives identical initial weights"
      # Section 2 asks for hardware-aware activation justification. The intended
      # argument, for Member 2 to make properly in the report:
      #   ReLU / ReLU6 are a single max() - no exponential, no lookup table, and
      #   no FPU needed. sigmoid, tanh, ELU and Swish all cost a transcendental
      #   per activation, which dominates on a microcontroller. ReLU6's bounded
      #   range additionally makes int8 post-training quantisation well behaved,
      #   which is what actually gets a model onto an MCU.
      activation_note: see report Section 2
